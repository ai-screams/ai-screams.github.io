name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_changed: ${{ steps.indexnow.outputs.changed }}
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: sitemap lastmod is the last commit touching content.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # IndexNow (Bing, Naver, Yandex, ...) only when this commit changed
      # site content; resubmitting unchanged URLs on every dependency bump
      # risks being treated as spam (HTTP 429).
      - name: Prepare IndexNow payload
        id: indexnow
        run: |
          if git diff --quiet HEAD~1 HEAD -- src public index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "payload=$(node scripts/indexnow-payload.mjs)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage || format('https://{0}.github.io', github.repository_owner) }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub's Pages deploy API intermittently returns "Deployment failed,
      # try again later" — a transient server-side error. Retry once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # After a successful deploy, tell IndexNow-enabled engines the pages
  # changed so they recrawl within minutes instead of on their own schedule.
  # Never fails the workflow: a rejected ping only leaves a warning.
  indexnow:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_changed == 'true'
    permissions: {}
    steps:
      - name: Submit changed pages to IndexNow
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
        run: |
          code=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD") || code="network error"
          echo "IndexNow HTTP $code for $PAYLOAD"
          cat response.txt 2>/dev/null || true
          case "$code" in
            200|202) ;;
            *) echo "::warning title=IndexNow::submission returned HTTP $code" ;;
          esac
